name: Refresh Latest Release Artwork

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Serialize with the daily catalog job so static artwork is never published
# over a simultaneous catalog update.
concurrency:
  group: scrape-catalog
  cancel-in-progress: false

jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install artwork verification dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Test targeted refresh and publication safeguards
        run: node --test scripts/test-latest-artwork-refresh.mjs scripts/test-regular-artwork.mjs scripts/test-carousel-admission.mjs
      - name: Prepare recent artwork, descriptions and airing schedules
        run: node scripts/refresh-latest-artwork.mjs
        timeout-minutes: 16
      - name: Refresh AnimeYT recent identities and UTC schedule
        run: node scripts/build-animeyt-index.mjs --incremental
        timeout-minutes: 2
        continue-on-error: true
      - name: Refresh homepage starter catalog
        run: node scripts/build-homepage-bootstrap.mjs
      - name: Verify artwork and episode identities
        run: node --test scripts/test-new-release-artwork.mjs scripts/test-schedule-stability.mjs scripts/test-carousel-admission.mjs
      - name: Publish only validated asset changes
        id: commit-catalog
        env:
          CATALOG_UPDATE_SCOPE: regular
        run: bash scripts/commit-catalog-update.sh
      - name: Trigger configured Vercel deploy hook
        if: steps.commit-catalog.outputs.changes_detected == 'true' && vars.CLOUDFLARE_PRODUCTION_ENABLED != 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl --max-time 30 -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          else
            echo "Using the existing Vercel Git integration."
          fi
