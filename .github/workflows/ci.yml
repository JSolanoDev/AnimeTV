name: CI

on:
  push:
    branches: [main, "codex/network-service-worker-audit", "codex/console-reliability-v1021", "codex/episode-startup-v1022", "codex/seek-startup-reliability-v1023", "codex/artwork-stall-reliability-v1024"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      # Syntax across every server/client/js file, asset-version consistency
      # (guards the stale-helper white-screen: a js/*.js left on an older ?v=
      # than client.js throws a ReferenceError and blanks the app), and the
      # secret/env-file audit.
      - name: Static checks, asset versions, security audit
        run: npm run check

      # The regression suite: season/split-cour grouping, image fallback, and
      # the adult classifier. That last group exists because a refactor once
      # silently disabled adult detection while BOTH node --check and eslint
      # passed - only behaviour caught it, so it has to run here.
      - name: Tests
        run: npm test

      - name: Release calendar tests
        # Cheerio is already installed by npm ci; do not re-resolve app packages.
        run: npm run test:releases

      # Bug-focused rules (no-redeclare, no-dupe-keys, no-unreachable, ...).
      # Isolated tooling must not re-resolve the app's locked dependencies.
      - name: Lint without dependency edits
        run: npm exec --yes --package=eslint@8 -- eslint client.js animetv-local.js animetv-server.js "js/*.js" "player/*.js" "scripts/*.mjs" "api/**/*.js" service-worker.js

      - name: Production build
        run: npm run build && npm run build:verify
