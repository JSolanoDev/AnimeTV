name: Refresh Adult Mode catalog

on:
  schedule:
    # Daily, away from the busier top of the hour. GitHub may delay scheduled jobs.
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-adult-catalog.yml'
      - 'scripts/refresh-adult-catalog.mjs'
      - 'scripts/check-adult-refresh-status.mjs'
      - 'scripts/run-adult-refresh-linux.sh'
      - 'scripts/test-linux-adult-refresh.mjs'
      - 'ops/systemd/zenkaitv-adult-refresh.*'
      - 'scripts/prepare-adult-artwork.mjs'
      - 'scripts/commit-catalog-update.sh'
      - 'scripts/lib/adult-upstream.mjs'
      - 'scripts/lib/artwork-availability.mjs'
      - 'scripts/build-underhentai-*.mjs'
      - 'scripts/build-adult-portrait-map.mjs'

permissions:
  contents: write

# Serialize catalog writers, but do not depend on the regular scraper succeeding.
concurrency:
  group: scrape-catalog
  cancel-in-progress: false

jobs:
  refresh:
    name: Check, validate, and publish Adult Mode catalog
    # Enable only after the external daily service has passed end-to-end checks.
    if: github.event_name != 'schedule' || vars.ADULT_REFRESH_EXTERNAL != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3, Node.js 24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 50

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0, Node.js 24
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test transactional refresh and provider outages
        run: npm run test:adult-refresh

      - name: Refresh Adult Mode catalog
        run: npm run adult:catalog
        env:
          UNDERHENTAI_CRAWL_CONCURRENCY: '2'
          UNDERHENTAI_DETAIL_CONCURRENCY: '2'
          UNDERHENTAI_WATCH_CONCURRENCY: '2'
          UNDERHENTAI_REQUEST_INTERVAL_MS: '550'
        timeout-minutes: 45

      - name: Check refresh result and publication safety
        id: refresh-status
        run: node scripts/check-adult-refresh-status.mjs --allow-preserved-outage

      - name: Validate Adult Mode catalog
        run: npm run adult:verify && npm run test:releases

      - name: Publish changed Adult Mode catalog
        if: steps.refresh-status.outputs.changes_detected == 'true'
        id: commit-catalog
        shell: bash
        env:
          CATALOG_UPDATE_SCOPE: adult
        run: bash scripts/commit-catalog-update.sh

      - name: Trigger Vercel deploy hook
        if: steps.commit-catalog.outputs.changes_detected == 'true' && vars.CLOUDFLARE_PRODUCTION_ENABLED != 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not configured; relying on the Vercel Git integration."
            exit 0
          fi
          curl --connect-timeout 10 --max-time 30 -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"

      - name: Upload refresh status
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node.js 24
        with:
          name: adult-refresh-status-${{ github.run_id }}
          path: artifacts/adult-refresh-report.json
          retention-days: 7
          if-no-files-found: warn
