name: Deploy approved Cloudflare backend staging

on:
  push:
    branches: ["cloudflare-staging/container-staging-2026-10-09"]

permissions:
  contents: read

concurrency:
  group: cloudflare-container-staging-deploy
  cancel-in-progress: false

jobs:
  staging:
    if: github.repository == 'JSolanoDev/AnimeTV' && github.ref == 'refs/heads/cloudflare-staging/container-staging-2026-10-09'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install existing locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate existing app and isolated gateway
        run: npm run check && npm test && npm run test:cloudflare && npm run test:cloudflare:containers
      - name: Prepare verified assets and sanitized backend context
        run: npm run cloudflare:containers:prepare
      - name: Build and smoke-test Linux backend
        run: npm run cloudflare:containers:build && npm run cloudflare:containers:smoke -- --network
      - name: Validate Worker and container together without deployment
        run: npm run cloudflare:containers:dry-run && npm run cloudflare:containers:integration
      - name: Deploy only the approved single-container staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_APPROVE_STAGING_DEPLOY: "1"
        run: npm run cloudflare:containers:deploy:staging
      - name: Confirm hosted staging readiness
        run: curl --fail --show-error --silent --max-time 40 https://zenkaitv-container-staging.juankisantiago.workers.dev/api/health
