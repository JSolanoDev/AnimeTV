plugins {
    id "com.android.application"
}

android {
    namespace "com.animetv.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.animetv.app"
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName "1.2"
    }

    flavorDimensions "device"
    productFlavors {
        mobile {
            dimension "device"
            applicationIdSuffix ".mobile"
            manifestPlaceholders = [
                mainOrientation: "unspecified",
                playerOrientation: "unspecified",
                touchscreenRequired: "true",
                leanbackRequired: "false"
            ]
        }
        tv {
            dimension "device"
            manifestPlaceholders = [
                mainOrientation: "landscape",
                playerOrientation: "landscape",
                touchscreenRequired: "false",
                leanbackRequired: "true"
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def media3 = "1.4.1"
    // Native ExoPlayer so the TV app can play sources (HLS / MP4) the WebView can't.
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
}
