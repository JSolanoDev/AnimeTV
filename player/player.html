<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>ZenkaiTV Player</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="/player/player.css?v=642">
  <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.6.16/dist/hls.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
  <script defer src="/player/player.js?v=642"></script>
</head>
<body>
  <main class="ztv-player-page">
    <div class="ztv-backdrop" id="playerBackdrop" aria-hidden="true"></div>
    <!-- An overlay, not a row: it floats over the picture on a gradient that
         fades out downward, so opening or collapsing it never resizes the video.
         The back and toggle buttons below are NOT inside it - they keep the same
         coordinates in both states, so nothing jumps when you toggle. -->
    <header class="ztv-player-topbar" id="playerTopbar">
      <div class="ztv-title-block">
        <p class="ztv-kicker" id="episodeLabel">ZenkaiTV</p>
        <h1 id="playerTitle">Video Player</h1>
      </div>
      <!-- Mascot lives in the empty middle of the bar. Purely decorative:
           aria-hidden, pointer-events:none, and it removes itself if the sprite
           files are absent, so the bar is unchanged until they are added. -->
      <div class="ztv-mascot" id="ztvMascot" aria-hidden="true">
        <img class="ztv-mascot-frame" id="ztvMascotFrame" alt="" decoding="async">
      </div>
      <div class="ztv-player-brand" aria-label="ZenkaiTV">
        <img class="ztv-brand-wordmark" src="/logo-wordmark-480.webp" alt="ZenkaiTV">
        <img class="ztv-brand-mark" src="/logo-mark-transparent.png" alt="" aria-hidden="true">
      </div>
    </header>

    <!-- Persistent chrome. These two sit outside the header on purpose: they hold
         the SAME top-left / top-right corners whether the bar is open or
         collapsed, so the toggle never moves out from under your finger and back
         is always reachable. -->
    <button class="ztv-corner-button ztv-corner-back" id="backButton" type="button" aria-label="Go back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"></path></svg>
    </button>
    <button class="ztv-corner-button ztv-corner-toggle" id="chromeToggle" type="button" aria-label="Hide the title bar" aria-expanded="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg>
    </button>

    <!-- Compact stand-in for the title while the bar is collapsed, on the same
         line as the back button rather than over the picture below it. -->
    <p class="ztv-floating-label" id="floatingLabel" hidden>
      <span class="ztv-floating-ep" id="floatingEpisode"></span>
      <span class="ztv-floating-title" id="floatingTitle"></span>
    </p>

    <section class="ztv-player-shell" aria-label="Video player">
      <div id="player" class="ztv-artplayer"></div>
      <div class="ztv-loading" id="loadingState" aria-live="polite">
        <div class="ztv-loader-mark" aria-hidden="true">
          <span></span>
          <span></span>
        </div>
        <strong>Loading stream...</strong>
      </div>
      <div class="ztv-error" id="errorState" role="alert" hidden>
        <div class="ztv-error-play" aria-hidden="true"></div>
        <strong id="errorTitle">No video source</strong>
        <p id="errorMessage">Choose a playable server and try again.</p>
        <div class="ztv-error-actions">
          <button class="ztv-primary-button" id="retryButton" type="button">Retry</button>
          <button class="ztv-secondary-button" id="homeButton" type="button">Home</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
