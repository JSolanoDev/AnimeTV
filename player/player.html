<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>ZenkaiTV Player</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="/player/player.css?v=509">
  <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.6.16/dist/hls.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
  <script defer src="/player/player.js?v=509"></script>
</head>
<body>
  <main class="ztv-player-page">
    <div class="ztv-backdrop" id="playerBackdrop" aria-hidden="true"></div>
    <header class="ztv-player-topbar">
      <button class="ztv-icon-button" id="backButton" type="button" aria-label="Go back">
        <span aria-hidden="true">‹</span>
      </button>
      <div class="ztv-title-block">
        <p class="ztv-kicker" id="episodeLabel">ZenkaiTV</p>
        <h1 id="playerTitle">Video Player</h1>
      </div>
      <div class="ztv-player-brand" aria-label="ZenkaiTV">
        <img class="ztv-brand-wordmark" src="/logo-wordmark-480.webp" alt="ZenkaiTV">
        <img class="ztv-brand-mark" src="/logo-mark-transparent.png" alt="" aria-hidden="true">
      </div>
    </header>

    <section class="ztv-player-shell" aria-label="Video player">
      <div id="player" class="ztv-artplayer"></div>
      <div class="ztv-loading" id="loadingState" aria-live="polite">
        <div class="ztv-loader-mark" aria-hidden="true">
          <span></span>
          <span></span>
        </div>
        <strong>Loading stream...</strong>
      </div>
      <div class="ztv-error" id="errorState" role="alert" hidden>
        <div class="ztv-error-play" aria-hidden="true"></div>
        <strong id="errorTitle">No video source</strong>
        <p id="errorMessage">Choose a playable server and try again.</p>
        <div class="ztv-error-actions">
          <button class="ztv-primary-button" id="retryButton" type="button">Retry</button>
          <button class="ztv-secondary-button" id="homeButton" type="button">Home</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
